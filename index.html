<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Accesos</title>
<meta name="description" content="Panel de accesos a las apps de Apps Script de CENCOH.">
<meta name="theme-color" content="#1f5ad8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#f3f4f8;--ink:#16181d;--muted:#5b6170;--blue:#1f5ad8;--line:#e2e5ee}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .caja{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px 24px;text-align:center}
  img{width:88px;height:88px;border-radius:20px}
  h1{font-size:24px;margin:16px 0 6px}
  p{color:var(--muted);line-height:1.5;margin:0 0 20px}
  .btn{display:block;width:100%;font:inherit;font-weight:600;font-size:16px;padding:14px 18px;border-radius:12px;border:1px solid transparent;cursor:pointer;text-decoration:none;margin-top:10px}
  .primario{background:var(--blue);color:#fff}
  .secundario{background:#fff;color:var(--muted);border-color:var(--line)}
  .nota{font-size:13px;margin-top:18px}
  [hidden]{display:none !important}
  .cargando{display:inline-block;width:18px;height:18px;border:3px solid #c9d6f6;border-top-color:var(--blue);border-radius:50%;animation:g 0.8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="caja">
  <img src="icon-192.png" alt="">
  <h1>Mis Accesos</h1>
  <p id="texto">Tus apps de Apps Script en un solo lugar.</p>
  <a class="btn primario" id="abrir" href="#">Abrir panel</a>
  <button class="btn secundario" id="instalar" hidden>Instalar en este teléfono</button>
  <p class="nota" id="ayuda">Para instalarla en Android: menú ⋮ de Chrome → «Instalar app» o «Agregar a la pantalla principal».</p>
</div>
<script>
  /* Enlace de la app web (Apps Script). Si algún día cambia, solo se edita esta línea. */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzRkKuJEzi4E9H-xgavL82UkssJw23vQuP0AijyHCOMKpczZPVeBvwPiWC9rXjBiBWNXw/exec';

  document.getElementById('abrir').href = APP_URL;

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  /* Abierta como app instalada (ícono o APK): ir directo al panel */
  var instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone ||
                  /[?&]source=app/.test(location.search) || document.referrer.indexOf('android-app://') === 0;
  if (instalada) {
    document.getElementById('texto').innerHTML = '<span class="cargando"></span>Abriendo tu panel…';
    document.getElementById('ayuda').hidden = true;
    if (navigator.onLine === false) {
      document.getElementById('texto').textContent = 'Sin conexión a internet. Conéctate y toca «Abrir panel».';
    } else {
      location.replace(APP_URL);
    }
  }

  /* Botón de instalación (Chrome en Android) */
  var aviso;
  addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); aviso = e;
    document.getElementById('instalar').hidden = false;
    document.getElementById('ayuda').hidden = true;
  });
  document.getElementById('instalar').addEventListener('click', function(){
    if (!aviso) return;
    aviso.prompt();
    aviso.userChoice.finally(function(){ aviso = null; document.getElementById('instalar').hidden = true; });
  });
  addEventListener('appinstalled', function(){ document.getElementById('instalar').hidden = true; });
</script>
</body>
</html>
